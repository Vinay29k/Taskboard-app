upstream taskboard_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;                 # don't advertise the nginx version
    client_max_body_size 1m;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/taskboard.access.log;
    error_log  /var/log/nginx/taskboard.error.log;

    # Static frontend: served by nginx directly, Node never sees these requests
    root /opt/taskboard/public;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg|png|ico)$ {
        expires 1h;
    }

    # API and health checks go to Node
    location ~ ^/(api/|healthz$|readyz$) {
        proxy_pass http://taskboard_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Metrics are internal only
    location = /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://taskboard_app;
    }
}
